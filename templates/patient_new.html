{% extends "base.html" %}{% block content %}<h1>Register patient</h1>
<form method="post" class="card"><div class="ff">
<div><label>Civil ID *</label><input name="civil_id" id="civil" required> <button type="button" class="btn sm sec" onclick="lookup()">Find</button> <span id="lk" class="muted">{% if not lookup_on %}(main-app lookup not configured){% endif %}</span></div>
<div><label>Full name *</label><input name="full_name" id="full_name" required></div>
<div><label>Date of birth</label><input type="date" name="date_of_birth" id="date_of_birth"></div>
<div><label>Sex</label><select name="sex" id="sex"><option value=""></option><option>Male</option><option>Female</option></select></div>
<div><label>Nationality</label><input name="nationality" id="nationality"></div><div><label>Phone</label><input name="phone" id="phone"></div>
<div><label>Blood group</label><input name="blood_group" id="blood_group"></div><div><label>Hospital file no.</label><input name="file_number" id="file_number"></div></div>
<p><button class="btn">Register</button></p></form>
<script>function lookup(){var c=document.getElementById('civil').value.trim();if(!c)return;var lk=document.getElementById('lk');lk.textContent='Searching...';
fetch('{{ url_for("patients.lookup") }}?civil_id='+encodeURIComponent(c),{credentials:'same-origin'}).then(r=>r.json()).then(d=>{if(!d.found){lk.textContent='Not found - enter details manually.';return}
lk.textContent='Found ('+(d.source==='main_app'?'main hospital system':'LTU')+').';['full_name','date_of_birth','sex','nationality','phone','blood_group','file_number'].forEach(k=>{var e=document.getElementById(k);if(e&&d[k])e.value=d[k]})}).catch(()=>lk.textContent='Lookup failed.')}</script>{% endblock %}
